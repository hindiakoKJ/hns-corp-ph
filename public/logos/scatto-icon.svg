<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="72%" r="60%">
      <stop offset="0%" stop-color="#3a1a08"/>
      <stop offset="100%" stop-color="#0d0908"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8040" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ff6b35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa70"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Warm glow blob -->
  <ellipse cx="256" cy="310" rx="160" ry="120" fill="url(#glow)"/>

  <!-- Outer dial ring -->
  <circle cx="256" cy="230" r="148" fill="none" stroke="#3a2010" stroke-width="2"/>

  <!-- Tick marks around dial -->
  <g stroke="#c45a20" stroke-width="2" opacity="0.7">
    <line x1="256" y1="82" x2="256" y2="98" transform="rotate(0 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(30 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(60 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="98" transform="rotate(90 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(120 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(150 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="98" transform="rotate(180 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(210 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(240 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="98" transform="rotate(270 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(300 256 230)"/>
    <line x1="256" y1="82" x2="256" y2="92" transform="rotate(330 256 230)"/>
  </g>

  <!-- Aperture blades (6-blade shutter) -->
  <g opacity="0.5" fill="#1e0e06" stroke="#6b3010" stroke-width="1.5">
    <ellipse cx="256" cy="185" rx="32" ry="68" transform="rotate(0 256 230)"/>
    <ellipse cx="256" cy="185" rx="32" ry="68" transform="rotate(60 256 230)"/>
    <ellipse cx="256" cy="185" rx="32" ry="68" transform="rotate(120 256 230)"/>
    <ellipse cx="256" cy="185" rx="32" ry="68" transform="rotate(180 256 230)"/>
    <ellipse cx="256" cy="185" rx="32" ry="68" transform="rotate(240 256 230)"/>
    <ellipse cx="256" cy="185" rx="32" ry="68" transform="rotate(300 256 230)"/>
  </g>

  <!-- Inner aperture circle -->
  <circle cx="256" cy="230" r="52" fill="#0d0908" stroke="#3a1a08" stroke-width="1.5"/>

  <!-- Center dot glow -->
  <circle cx="256" cy="230" r="28" fill="url(#dotGlow)" opacity="0.9"/>
  <circle cx="256" cy="230" r="14" fill="#fff5ee" opacity="0.95"/>
  <circle cx="256" cy="230" r="6" fill="#ffffff"/>

  <!-- SCATTO wordmark -->
  <text
    x="256"
    y="408"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="64"
    letter-spacing="8"
    fill="#f5e8dc"
    text-anchor="middle"
  >SCATTO</text>

  <!-- ISO label -->
  <text
    x="256"
    y="448"
    font-family="'Courier New', monospace"
    font-weight="700"
    font-size="22"
    letter-spacing="4"
    fill="#ff6b35"
    text-anchor="middle"
    opacity="0.85"
  >ISO 400</text>
</svg>
