<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#4a0d1e"/>
      <stop offset="100%" stop-color="#1a0308"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9a8c9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Soft glow -->
  <ellipse cx="256" cy="270" rx="180" ry="140" fill="url(#glow)"/>

  <!-- Heart shape -->
  <path d="M256 370
    C256 370 110 280 110 185
    C110 140 145 108 185 108
    C215 108 240 128 256 148
    C272 128 297 108 327 108
    C367 108 402 140 402 185
    C402 280 256 370 256 370Z"
    fill="#DB2777" opacity="0.85"/>

  <!-- Inner heart highlight -->
  <path d="M256 340
    C256 340 140 268 140 190
    C140 158 162 136 192 136
    C218 136 238 152 256 170
    C274 152 294 136 320 136
    C350 136 372 158 372 190
    C372 268 256 340 256 340Z"
    fill="#f472b6" opacity="0.3"/>

  <!-- Small sparkle dots -->
  <circle cx="170" cy="155" r="5" fill="#fda4c8" opacity="0.6"/>
  <circle cx="155" cy="178" r="3" fill="#fda4c8" opacity="0.4"/>
  <circle cx="340" cy="148" r="4" fill="#fda4c8" opacity="0.5"/>
  <circle cx="362" cy="168" r="3" fill="#fda4c8" opacity="0.35"/>

  <!-- Wordmark -->
  <text
    x="256"
    y="434"
    font-family="'Georgia', 'Times New Roman', serif"
    font-weight="700"
    font-size="52"
    letter-spacing="2"
    fill="#fce7f3"
    text-anchor="middle"
    opacity="0.95"
  >everafter</text>
</svg>
